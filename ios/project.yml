name: Reymont
options:
  bundleIdPrefix: app.reymont
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

targets:
  Reymont:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Reymont
        excludes:
          - "**/.DS_Store"
          - "Resources/**"
    resources:
      - path: Reymont/Resources/Assets.xcassets
      - path: Reymont/Resources/SampleBooks
        type: folder
    dependencies:
      - package: ZIPFoundation
    info:
      path: Reymont/Info.plist
      properties:
        CFBundleDisplayName: Reymont
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Book
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.reymont.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        DEVELOPMENT_ASSET_PATHS: ""
